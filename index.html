<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>D&D Калькулятор</title>
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			margin: 0;
			padding: 16px;
			background: var(--tg-theme-bg-color, #fff);
			color: var(--tg-theme-text-color, #000);
		}
		h1 { font-size: 18px; margin: 0 0 16px 0; }
		.section {
			background: var(--tg-theme-secondary-bg-color, #f5f5f5);
			border-radius: 12px;
			padding: 12px;
			margin-bottom: 12px;
		}
		.section-title {
			font-weight: 600;
			margin-bottom: 8px;
		}
		.row {
			display: flex;
			gap: 8px;
			margin-bottom: 8px;
			flex-wrap: wrap;
		}
		button {
			flex: 1;
			min-width: 70px;
			padding: 10px 8px;
			border: none;
			border-radius: 8px;
			background: var(--tg-theme-button-color, #2481cc);
			color: var(--tg-theme-button-text-color, #fff);
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
		}
		button.secondary {
			background: var(--tg-theme-secondary-bg-color, #e0e0e0);
			color: var(--tg-theme-text-color, #000);
		}
		input, select {
			width: 100%;
			padding: 10px;
			border: 1px solid rgba(0,0,0,0.1);
			border-radius: 8px;
			font-size: 14px;
			box-sizing: border-box;
			margin-bottom: 8px;
			background: var(--tg-theme-bg-color, #fff);
			color: var(--tg-theme-text-color, #000);
		}
		.inputs { display: flex; gap: 8px; }
		.inputs input, .inputs select { flex: 1; }
		.hint { font-size: 12px; opacity: 0.7; margin-top: -4px; margin-bottom: 8px; }
		.mode { display: flex; gap: 8px; margin-bottom: 8px; }
		.mode label { flex: 1; font-size: 13px; }
	</style>
</head>
<body>
	<h1>D&D Калькулятор</h1>

	<div class="section">
		<div class="section-title">Бросок d20</div>
		<div class="mode">
			<label><input type="radio" name="d20mode" value="normal" checked> Обычный</label>
			<label><input type="radio" name="d20mode" value="advantage"> Преим.</label>
			<label><input type="radio" name="d20mode" value="disadvantage"> Помеха</label>
			<label><input type="radio" name="d20mode" value="elven"> Эльф. точность</label>
		</div>
		<div class="row">
			<input type="number" id="d20count" placeholder="Кол-во d20" value="1" min="1">
			<input type="number" id="d20mod" placeholder="Модификатор" value="0">
		</div>
		<button onclick="sendRoll()">Бросить</button>
	</div>

	<div class="section">
		<div class="section-title">Урон атаки</div>
		<div class="row">
			<input type="number" id="attacks" placeholder="Атак" value="1" min="1">
			<input type="text" id="damage" placeholder="Формула, например 2d6+3">
		</div>
		<div class="hint">Можно: 2d6+1d4+3-1. Разделитель d/д.</div>
		<div class="row">
			<button onclick="sendDamage()">Посчитать</button>
			<button class="secondary" onclick="chooseWeapon()">Выбрать оружие</button>
		</div>
	</div>

	<div class="section">
		<div class="section-title">Мои оружия</div>
		<div class="row">
			<input type="text" id="weaponName" placeholder="Название">
			<input type="text" id="weaponFormula" placeholder="Урон, например 2d6+3">
		</div>
		<div class="row">
			<button onclick="addWeapon()">Добавить</button>
			<button class="secondary" onclick="listWeapons()">Список</button>
		</div>
		<div class="row">
			<input type="text" id="deleteName" placeholder="Название для удаления">
			<button class="secondary" onclick="deleteWeapon()">Удалить</button>
		</div>
	</div>

	<script>
		const tg = window.Telegram.WebApp;
		tg.ready();
		tg.expand();

		function sendJson(payload) {
			tg.sendData(JSON.stringify(payload));
		}

		function getMode() {
			return document.querySelector('input[name="d20mode"]:checked').value;
		}

		function getInt(id, defaultValue) {
			const v = parseInt(document.getElementById(id).value, 10);
			return isNaN(v) ? defaultValue : v;
		}

		function sendRoll() {
			sendJson({
				action: "d20",
				mode: getMode(),
				count: getInt("d20count", 1),
				modifier: getInt("d20mod", 0)
			});
		}

		function sendDamage() {
			sendJson({
				action: "damage",
				attacks: getInt("attacks", 1),
				formula: document.getElementById("damage").value.trim()
			});
		}

		function chooseWeapon() {
			sendJson({ action: "damage_choose_weapon" });
		}

		function addWeapon() {
			const name = document.getElementById("weaponName").value.trim();
			const formula = document.getElementById("weaponFormula").value.trim();
			if (!name || !formula) {
				tg.showAlert("Нужны название и формула");
				return;
			}
			sendJson({ action: "add_weapon", name: name, formula: formula });
		}

		function deleteWeapon() {
			const name = document.getElementById("deleteName").value.trim();
			if (!name) {
				tg.showAlert("Нужно название");
				return;
			}
			sendJson({ action: "delete_weapon", name: name });
		}

		function listWeapons() {
			sendJson({ action: "list_weapons" });
		}
	</script>
</body>
</html>
